[project]
name = "sugarmarket-api"
version = "0.1.0"
description = "Local Sugarmarket demo API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "onnxruntime>=1.29.0",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
# 模型训练环境（PyTorch CUDA）；API 运行不需要，按需 `uv sync --group train`。
# 面向本机 RTX 2080 Ti（Turing, sm_75）；驱动 595 兼容 CUDA 12.8 运行时。
train = [
  "onnx>=1.22.0",
  "torch>=2.9,<3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", group = "train" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["app", "adder", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
